services:
  - type: web
    name: mani-me
    runtime: node
    plan: standard
    buildCommand: npm install && npm install -g pm2
    startCommand: pm2-runtime ecosystem.config.js --env production
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false  # Base64-encoded Firebase service account JSON (required for chat)
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: FROM_EMAIL
        value: noreply@manime.co.uk
      - key: FROM_NAME
        value: Mani Me
    healthCheckPath: /health
    autoDeploy: true
