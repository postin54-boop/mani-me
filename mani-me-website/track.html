<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Your Parcel | Mani Me</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy: #0B1A33;
            --sky: #83C5FA;
            --white: #FFFFFF;
            --success: #10B981;
            --warning: #F59E0B;
            --gray-400: #9ca3af;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, var(--navy) 0%, #162d4d 100%);
            min-height: 100vh;
            color: var(--white);
        }
        
        .container {
            max-width: 420px;
            margin: 0 auto;
            padding: 32px 20px;
        }
        
        /* Header */
        .header {
            text-align: center;
            margin-bottom: 24px;
        }
        
        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 12px;
            text-decoration: none;
        }
        
        .logo-img {
            width: 48px;
            height: 48px;
            border-radius: 10px;
        }
        
        .logo-text {
            font-size: 24px;
            font-weight: 700;
            color: var(--white);
        }
        
        /* Search */
        .search-box {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 20px;
        }
        
        .search-row {
            display: flex;
            gap: 10px;
        }
        
        .search-input {
            flex: 1;
            padding: 12px 14px;
            font-size: 15px;
            border: none;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            color: var(--white);
            outline: none;
        }
        
        .search-input::placeholder { color: var(--gray-400); }
        
        .search-btn {
            padding: 12px 18px;
            background: var(--sky);
            color: var(--navy);
            font-size: 15px;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
        
        .search-btn:disabled { opacity: 0.5; }
        
        /* Loading */
        .loading {
            text-align: center;
            padding: 40px;
            display: none;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(131, 197, 250, 0.2);
            border-top-color: var(--sky);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 12px;
        }
        
        @keyframes spin { to { transform: rotate(360deg); } }
        
        /* Results */
        .results { display: none; }
        
        .card {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 16px;
        }
        
        /* Tracking Header */
        .tracking-header {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .tracking-label {
            font-size: 11px;
            color: var(--gray-400);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .tracking-id {
            font-size: 20px;
            font-weight: 700;
            color: var(--sky);
            font-family: monospace;
            margin-top: 4px;
        }
        
        /* Status Badge */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 18px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            margin-top: 12px;
        }
        
        .status-pending { background: rgba(245, 158, 11, 0.2); color: var(--warning); }
        .status-booked { background: rgba(131, 197, 250, 0.2); color: var(--sky); }
        .status-picked_up { background: rgba(59, 130, 246, 0.2); color: #3B82F6; }
        .status-in_transit { background: rgba(168, 85, 247, 0.2); color: #A855F7; }
        .status-customs { background: rgba(245, 158, 11, 0.2); color: var(--warning); }
        .status-out_for_delivery { background: rgba(16, 185, 129, 0.2); color: var(--success); }
        .status-delivered { background: rgba(16, 185, 129, 0.3); color: var(--success); }
        
        /* Route */
        .route {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px;
            background: rgba(131, 197, 250, 0.1);
            border-radius: 12px;
            margin-bottom: 20px;
        }
        
        .route-point {
            text-align: center;
        }
        
        .route-point .flag { font-size: 28px; }
        .route-point .city { font-size: 13px; font-weight: 600; margin-top: 2px; }
        
        .route-arrow {
            color: var(--sky);
            font-size: 20px;
        }
        
        /* People Cards */
        .people-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }
        
        .person-card {
            padding: 14px;
            border-radius: 10px;
        }
        
        .person-card.sender {
            background: rgba(131, 197, 250, 0.1);
        }
        
        .person-card.receiver {
            background: rgba(16, 185, 129, 0.1);
        }
        
        .section-label {
            font-size: 10px;
            color: var(--gray-400);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }
        
        .person-name {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 2px;
        }
        
        .person-phone {
            font-size: 12px;
            color: var(--sky);
            margin-bottom: 2px;
        }
        
        .person-location {
            font-size: 12px;
            color: var(--gray-400);
        }
        
        /* Delivery Estimate */
        .delivery-box {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
        }
        
        .delivery-label {
            font-size: 11px;
            color: var(--gray-400);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .delivery-date {
            font-size: 18px;
            font-weight: 700;
            color: var(--success);
            margin-top: 4px;
        }
        
        .delivery-note {
            font-size: 12px;
            color: var(--gray-400);
            margin-top: 6px;
        }
        
        /* Support */
        .support-link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px;
            background: linear-gradient(135deg, #25D366, #128C7E);
            border-radius: 12px;
            color: var(--white);
            font-weight: 600;
            text-decoration: none;
            font-size: 15px;
        }
        
        /* Error */
        .error-box {
            display: none;
            text-align: center;
            padding: 40px 20px;
        }
        
        .error-icon { font-size: 48px; margin-bottom: 12px; }
        .error-box h3 { color: #EF4444; margin-bottom: 6px; }
        .error-box p { color: var(--gray-400); font-size: 14px; }
        
        /* Footer */
        .footer {
            text-align: center;
            margin-top: 24px;
            color: var(--gray-400);
            font-size: 12px;
        }
        
        .footer a { color: var(--sky); text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="/" class="logo">
                <img src="/images/logo.png" alt="Mani Me" class="logo-img">
                <span class="logo-text">Mani Me</span>
            </a>
        </div>
        
        <div class="search-box">
            <div class="search-row">
                <input type="text" id="trackingInput" class="search-input" placeholder="Enter tracking number">
                <button id="trackBtn" class="search-btn">Track</button>
            </div>
        </div>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Looking up your parcel...</p>
        </div>
        
        <div class="error-box" id="errorBox">
            <div class="error-icon">📭</div>
            <h3>Parcel Not Found</h3>
            <p>Please check your tracking number and try again.</p>
        </div>
        
        <div class="results" id="results">
            <div class="card">
                <div class="tracking-header">
                    <div class="tracking-label">Tracking Number</div>
                    <div class="tracking-id" id="trackingId">—</div>
                    <div class="status-badge status-pending" id="statusBadge">⏳ Pending</div>
                </div>
                
                <div class="route">
                    <div class="route-point">
                        <div class="flag">🇬🇧</div>
                        <div class="city" id="fromCity">UK</div>
                    </div>
                    <div class="route-arrow">✈️ →</div>
                    <div class="route-point">
                        <div class="flag">🇬🇭</div>
                        <div class="city" id="toCity">Ghana</div>
                    </div>
                </div>
                
                <div class="people-row">
                    <div class="person-card sender">
                        <div class="section-label">📤 From</div>
                        <div class="person-name" id="senderName">—</div>
                        <div class="person-phone" id="senderPhone"></div>
                        <div class="person-location" id="senderLocation">UK</div>
                    </div>
                    <div class="person-card receiver">
                        <div class="section-label">📥 To</div>
                        <div class="person-name" id="receiverName">—</div>
                        <div class="person-phone" id="receiverPhone"></div>
                        <div class="person-location" id="receiverLocation">Ghana</div>
                    </div>
                </div>
                
                <div class="delivery-box">
                    <div class="delivery-label">📅 Estimated Delivery</div>
                    <div class="delivery-date" id="estimatedDate">—</div>
                    <div class="delivery-note">Typically 4-5 weeks from pickup</div>
                </div>
            </div>
            
            <a href="https://wa.me/447958086887" class="support-link" target="_blank">
                💬 Need Help? WhatsApp Us
            </a>
        </div>
        
        <div class="footer">
            <p>© 2026 <a href="/">Mani Me</a> · UK to Ghana Delivery</p>
        </div>
    </div>
    
    <script>
        const API_BASE = 'https://mani-me.onrender.com/api';
        const trackingInput = document.getElementById('trackingInput');
        const trackBtn = document.getElementById('trackBtn');
        const loading = document.getElementById('loading');
        const errorBox = document.getElementById('errorBox');
        const results = document.getElementById('results');
        
        const statusConfig = {
            pending: { label: 'Booked', icon: '📋', class: 'status-pending' },
            booked: { label: 'Booked', icon: '📋', class: 'status-booked' },
            pickup_scheduled: { label: 'Pickup Scheduled', icon: '📅', class: 'status-booked' },
            picked_up: { label: 'Picked Up', icon: '📦', class: 'status-picked_up' },
            in_uk_warehouse: { label: 'At UK Warehouse', icon: '🏭', class: 'status-picked_up' },
            in_transit: { label: 'On Way to Ghana', icon: '✈️', class: 'status-in_transit' },
            customs: { label: 'In Customs', icon: '🛃', class: 'status-customs' },
            in_ghana_warehouse: { label: 'In Ghana', icon: '🏭', class: 'status-in_transit' },
            out_for_delivery: { label: 'Out for Delivery', icon: '🛵', class: 'status-out_for_delivery' },
            delivered: { label: 'Delivered ✓', icon: '✅', class: 'status-delivered' }
        };
        
        // Check URL for tracking
        function checkURL() {
            const path = window.location.pathname;
            const match = path.match(/\/track\/(.+)/);
            if (match) {
                trackingInput.value = decodeURIComponent(match[1]);
                trackParcel();
                return;
            }
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id') || params.get('tracking') || params.get('t');
            if (id) {
                trackingInput.value = id;
                trackParcel();
            }
        }
        
        async function trackParcel() {
            const trackingNumber = trackingInput.value.trim().toUpperCase();
            if (!trackingNumber) return;
            
            loading.style.display = 'block';
            errorBox.style.display = 'none';
            results.style.display = 'none';
            trackBtn.disabled = true;
            
            try {
                const res = await fetch(`${API_BASE}/shipments/track/${trackingNumber}`);
                if (!res.ok) throw new Error('Not found');
                
                const json = await res.json();
                // API returns { shipment: {...} }
                displayResult(json.shipment || json);
            } catch (e) {
                errorBox.style.display = 'block';
            } finally {
                loading.style.display = 'none';
                trackBtn.disabled = false;
            }
        }
        
        function displayResult(data) {
            // Tracking ID
            document.getElementById('trackingId').textContent = data.tracking_number || '—';
            
            // Status
            const status = data.status || 'pending';
            const config = statusConfig[status] || statusConfig.pending;
            const badge = document.getElementById('statusBadge');
            badge.className = 'status-badge ' + config.class;
            badge.innerHTML = config.icon + ' ' + config.label;
            
            // Route - use pickup_city and delivery_city from model
            document.getElementById('fromCity').textContent = data.pickup_city || 'UK';
            document.getElementById('toCity').textContent = data.delivery_city || 'Ghana';
            
            // Sender
            document.getElementById('senderName').textContent = data.sender_name || '—';
            document.getElementById('senderPhone').textContent = data.sender_phone || '';
            const senderLoc = [data.pickup_city, data.pickup_postcode].filter(Boolean).join(', ') || 'UK';
            document.getElementById('senderLocation').textContent = senderLoc;
            
            // Receiver
            document.getElementById('receiverName').textContent = data.receiver_name || '—';
            document.getElementById('receiverPhone').textContent = data.receiver_phone || '';
            const receiverLoc = [data.delivery_city, data.delivery_region].filter(Boolean).join(', ') || 'Ghana';
            document.getElementById('receiverLocation').textContent = receiverLoc;
            
            // Estimated delivery
            let estDate = '4-5 weeks from pickup';
            if (data.estimated_delivery) {
                estDate = new Date(data.estimated_delivery).toLocaleDateString('en-GB', {
                    day: 'numeric', month: 'short', year: 'numeric'
                });
            } else if (data.pickup_date || data.createdAt) {
                const start = new Date(data.pickup_date || data.createdAt);
                const est = new Date(start);
                est.setDate(est.getDate() + 28);
                estDate = est.toLocaleDateString('en-GB', {
                    day: 'numeric', month: 'short', year: 'numeric'
                });
            }
            document.getElementById('estimatedDate').textContent = estDate;
            
            results.style.display = 'block';
        }
        
        trackBtn.addEventListener('click', trackParcel);
        trackingInput.addEventListener('keypress', e => { if (e.key === 'Enter') trackParcel(); });
        window.addEventListener('load', checkURL);
    </script>
</body>
</html>
